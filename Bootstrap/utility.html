<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
    <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container my-5">

        <!-- width -->
        <div class="bg-primary w-25">Width</div>
        <div class="bg-primary-subtle w-50">Width</div>
        <div class="bg-info w-75">Width</div>
        <div class="bg-info-subtle w-100">Width</div>

        <!-- spacing -->
         <!-- Padding p-1, p-2, p-3, p-4, p-5 -->
        <button class="btn btn-lg btn-primary p-5">Spacing</button> 
        <button class="btn btn-lg btn-primary pt-5">Spacing</button> 
        <button class="btn btn-lg btn-primary pe-5">Spacing</button> 
        <button class="btn btn-lg btn-primary pb-5">Spacing</button> 
        <button class="btn btn-lg btn-primary ps-5">Spacing</button> 

        <!-- Margin m-1, m-2, m-3, m-4, m-5 -->

         <button class="btn btn-lg btn-success mt-5">Spacing</button>
         <button class="btn btn-lg btn-success me-5">Spacing</button>
         <button class="btn btn-lg btn-success mb-5">Spacing</button>
