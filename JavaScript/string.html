    <script>
        //String
        let firstName = "Htoo Myat";
        let lastName = "Htin Lynn";
        console.log(typeof(firstName));
        console.log(typeof(lastName));

        console.log(`My name is ${fullName}.`);
        console.log(fullName[5]);
        console.log(fullName.toLowerCase());

        //substr(5,3) 5 is start index and 3 is start from the index 5

        let ser = "JavaScript is funny";
        let searchResult = ser.search("funny");
        console.log(searchResult);

        let replaceString = "I want to go for a walk.";
        console.log(replaceString);

        let replaceResult = replaceString.replace("walk" , "run");
        console.log(replaceResult);

        let fees = '350,000,000';
        console.log(fees);
        fees = fees.replace(/\,/g , '');
        console.log(Number(fees));
