<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>
        
        //Data Type

        //String Data Type
        let name = "Zenon";
        console.log(name);
        console.log(typeof(name));

        let job = 'Web Developer';
        console.log(job);
        console.log(typeof(job));

        let partTime = 'Instructor';
        console.log(partTime);
        console.log(typeof(partTime));

        document.write('<h1>My name is ${name}');

        //Numeric Data Type
        let age = 29;
        console.log(age);
        console.log(typeof(age));

        let pi = 3.14;
        console.log(pi);
        console.log(typeof(pi));

        //Boolean data typeof
        let js = true;
        console.log(js);
        console.log(typeof(js));
        let r = false;
        console.log(r);

        //Array
        let arr = ["Mg Mg" , "Mandalay", 32 ,true, [1,2,'y']];
        console.log(arr);
        console.log(typeof(arr));
        console.log(arr[2]);
        console.log(arr[4][2]);

        let arr1 = [["Mg Mg",30,"Mandalay"],["Ma Ma",20,"Yangon"],["Hla Hla",29,"Monywa"]];
        console.log(arr1[0][1]);
        console.log(arr1[1][2]);
    </script>
</head>
<body>
    
</body>
</html>
