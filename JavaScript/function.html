<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>

        //Function
        
        function funName() {
            document.write(`<h3>Hello Function!</h3>`);
        }
        funName();

        function add(num1 , num2) {
            let result = num1 + num2;
            document.write(`<h3>The result is ${result}</h3>`);
        }
        add(30,60);

        function sub(num1 = 50, num2 = 40) {
            let result = num1 - num2;
            document.write(`<h3>The result is ${result}</h3>`);
        }
        sub();
        sub(77,33);

        function getSize(length, width, height) {
            let area = length * width;
            let volumn = length * width * height;
            let sizes = [area,volumn];
            return sizes;
        }
        let sizes = getSize(120, 80, 49);
        document.write(`<h3>The area is ${sizes[0]}.</h3>`);
        document.write(`<h3>The volumn is ${sizes[1]}.</h3>`);

    </script>

</head>
