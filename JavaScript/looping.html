<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>
        //Looping
        for (let i = 1; i <= 5; i++) {
            document.write("<h3>Hello Js</h3>");
        }

        let laptops = ["MacBook","Acer","Dell","Asus","HP","Lenovo"];
        let leng = laptops.length;
        console.log(leng);

        for (let j = 0; j < leng; j++) {
            document.write(`<h3>Laptop name is ${laptops[j]}.</h3>`);
        }
 
        // *****
        // *****
        // *****
        // *****
        // *****

        for (let m = 0; m < 5; m++) {
            for (let n = 0; n < 5; n++) {
                document.write('*');
            }
            document.write("<br>");
        }
        
        // *
        // **
        // ***
        // ****
        // *****
        for (let h = 0; h < 5; h++) {
            for (let j = 0; j <= h; j++) {
                document.write("*");
            }
            document.write("<br>");
        }


        // let number = prompt("Enter a number:");
        // for (let r = 1; r <= 12; r++) {
        //     document.write(`<h3> ${number} x ${r} = ${number * r}`);
        // }


        //While Loop
        let num = 1;
        while (num < 0) {
            document.write(`<h3>This num is ${num}</h3>`);
            num++;
        }

        //Do while loop
        let no = 1;
        do {
            document.write(`<h3>This No is ${no}</h3>`);
            no++;
        }while (no < 0);

        
        // *****
        // ****
        // ***
        // **
        // *

        for (let q = 5; q >= 1; q--) {
            for (let r = 1; r <= q ; r++) {
                document.write("*");
            }
            document.write("<br>");
        }

    </script>

</head>

</body>
</html>
