<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        //Operator
        //Assignment Operator
        let x = 12;

        //Addition Operator
        let three = 1 + 2;
        console.log(three);
        let four = three + 1;
        console.log(four);
        let threeOne = "three" + 1;
        console.log(threeOne);
        let str = '23' + '32';
        console.log(str);
        let number = 5;
        number += 10;
        console.log(number);

        //Substraction Operator
        let two = 3 - 1;
        console.log(two);
        let five = '6' - '1';
        console.log(five);
        let num = 25;
        num -= 5;
        console.log(num);

        //Division Opearator
        let div1 = 20 / 5;
        console.log(div1);
        let div2 = 20 / 7;
        console.log(div2);
        let div3 = div2.toFixed(2);
        console.log(div3);
        div3 = Number(div3);
        console.log(div3);
        let div4 = 1 / 0;
        console.log(div4);
        let div = 20;
        div /= 4;
        console.log(div);

        //Remainder Operator
        let rem1 = 20 % 5;
        console.log(rem1);
        let rem2 = 20 % 7;
        console.log(rem2);
        let rem3 = 1 % 0;
        console.log(rem3);
        let rem = 25;
        rem %= 2;
        console.log(rem);

        //Multiplication Operator
        let mul1 = 12 * 12;
        console.log(mul1);
        let mul = 25;
        mul *= 2;
        console.log(mul);

        //Exponential Operator
        let exp1 = 2 ** 2;
        console.log(exp1);
        let exp2 = 4 ** 6;
        console.log(exp2);

        //Precendence

        // * / %
        // + -
        // =

        let total = 1 * 2 + 5 / 2 % 2;
        console.log(total);

        //Comparison Operator

        let n = 12;
        let m = '12';
        console.log( n < 15);
        console.log(n <= 12);

        console.log(n > 3);
        console.log(n >= 12);

        console.log(n == m); //Just only value
        console.log(n === m); // Check value and also data type

        console.log(n != m);
        console.log(n !== m);

        //Logical Operator
        //And &&
        // OR ||
        // !
        console.log( 12 > 10 && 15 < 20 && 10 < 15);
        console.log(10 < 12 || 10 > 15 || 20 < 4);
        
        
    </script>
</head>

</body>
</html>
