<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .flex-item {
            background-color: lightblue;
            padding: 10px;
        }

        .flex-container {
            display: flex;
            background-color: aqua;
            height: 200px;
            /* right left align */
            justify-content: center;
            /* top bottom align */
            align-items: center;
            /* range between flex items */
            gap: 20px;
        }
    </style>
</head>
<body>
    <div class="flex-container">
        <p class="flex-item">Item 1</p>
        <p class="flex-item">Item 2</p>
        <p class="flex-item">Item 3</p>
    </div>
</body>
</html>
