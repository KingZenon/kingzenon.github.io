<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nav bar Example</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .navbar {
            display: flex;
            background-color: #333;
            color: white;
            padding: 15px 30px;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 2rem;
            font-weight: bold;
        }

        .nav-link {
            list-style: none;
            display: flex;
            gap: 30px;
        }

        .nav-link li a {
            text-decoration: none;
            color: white;
            font-size: 1.3rem;
        }
        .nav-link li a:hover{
            color : red;
        }

    </style>
</head>
<body>
    <nav class="navbar">
        <div class="brand">Zenon Brand</div>
        <ul class="nav-link">
            <li>
                <a href="">Home</a>
            </li>
            <li>
                <a href="">Services</a>
            </li>
            <li>
                <a href="">About</a>
            </li>
            <li>
                <a href="">Contact</a>
            </li>
        </ul>
    </nav>
</body>
</html>
