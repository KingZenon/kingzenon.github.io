<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        a {
            /* inline to block */
            display: block;
            border: 7px solid brown;
            width: 50%;
            height: 100px;
            padding: 100px;
            margin: 20px;
            text-align: center;
        }

        h1 {
            display: inline;
            border: 5px solid green;
        }

        h2 {
            display: inline-block;
            border: 1px solid red;
            width: 250px;
            height: 100px;
        }

        h3 {
            /* between PC and phone screen difference use */
            display: none;
        }
    </style>
</head>
<body>
    <a href="">Welcome Home Sweet Home 1</a>
    <a href="">Welcome Home Sweet Home 2</a>

    <h1>Welcome Home Sweet Home 1</h1>
    <h1>Welcome Home Sweet Home 2</h1>

    <h2>Hello World</h2>
    <h2>Learn with practice</h2>

    <h3>Display None</h3>
</body>
</html>
